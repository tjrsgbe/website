name: C
on: [push]
jobs:
  gcc:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v1
    - name: Verficação de versão
      run:  lsb_release -a && gcc -v && bash -version && sudo apt-get install -y expect && which expect 
    - name: solucao
      run:  gcc -ftest-coverage -g3 solucao.c -o solucao && chmod +x solucao.sh && bash -x solucao.sh && gcov solucao.c
